name: Build Quran Studio APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor App
        run: |
          npx cap init "Quran Studio" com.quranstudio.luganda --web-dir=. --npm-client=npm || true
          npx cap add android || true
          mkdir -p android/app/src/main/assets/public
          cp index.html manifest.json service-worker.js reciters.json android/app/src/main/assets/public/ || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Studio-Luganda-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
